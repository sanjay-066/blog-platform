<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Blog Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<nav class="navbar">
  <div class="container nav-inner">
    <a href="/" class="nav-brand">📝Blog<span class="brand-dot">.</span><span>Platform</span></a>
    <div class="nav-links">
      <span class="text-muted text-sm">New here?</span>
      <a href="/register" class="btn btn-primary btn-sm">Sign Up →</a>
    </div>
  </div>
</nav>

<main>
  <div class="auth-layout">
    <div class="card auth-card">
      <div class="auth-brand-header">
        <span class="big-icon">👋</span>
        <h2>Welcome Back</h2>
        <p>Sign in to continue writing and reading</p>
      </div>

      <div class="card-body">
        <form id="login-form" novalidate>

          <div class="form-group" id="group-identifier">
            <label class="form-label" for="identifier">Username or Email</label>
            <div class="input-wrapper">
              <span class="input-icon">@</span>
              <input class="form-input" type="text" id="identifier"
                placeholder="you@example.com or username"
                autocomplete="username" required spellcheck="false" />
            </div>
            <span class="form-error" id="err-identifier">Please enter your username or email.</span>
          </div>

          <div class="form-group" id="group-password">
            <label class="form-label" for="password">
              Password
              <a href="#" style="font-size:.75rem;font-weight:600;text-transform:none;letter-spacing:0">Forgot it?</a>
            </label>
            <div class="input-wrapper">
              <input class="form-input" type="password" id="password"
                placeholder="••••••••" autocomplete="current-password" required
                style="padding-right:3rem" />
              <button type="button" class="pw-toggle" id="toggle-pw" aria-label="Show/hide password">👁</button>
            </div>
            <span class="form-error" id="err-password">Please enter your password.</span>
          </div>

          <div class="form-group d-flex align-center gap-sm">
            <input type="checkbox" id="remember" name="remember"
              style="width:1rem;height:1rem;accent-color:var(--clr-primary);cursor:pointer;flex-shrink:0" />
            <label for="remember" class="text-sm" style="cursor:pointer;margin:0">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
            Sign In
          </button>

          <div class="auth-divider">or</div>
          <p class="auth-footer">
            Don't have an account? <a href="/register"><strong>Create one for free</strong></a>
          </p>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="/static/js/app.js"></script>
<script>
  // Password toggle
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const btn = document.getElementById('toggle-pw');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    btn.textContent = pw.type === 'password' ? '👁' : '🙈';
  });

  // Validation helper
  function setErr(errId, grpId, show) {
    document.getElementById(errId).style.display = show ? 'flex' : 'none';
    document.getElementById(grpId).classList.toggle('field-error', show);
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const password   = document.getElementById('password').value;
    const remember   = document.getElementById('remember').checked;
    const btn        = document.getElementById('submit-btn');

    let valid = true;
    setErr('err-identifier', 'group-identifier', !identifier); if (!identifier) valid = false;
    setErr('err-password',   'group-password',   !password);   if (!password)   valid = false;
    if (!valid) return;

    setButtonLoading(btn, true);
    const { ok, data } = await api.post('/api/login', { identifier, password, remember });

    if (ok) {
      showAlert('Signed in! Redirecting…', 'success');
      setTimeout(() => window.location.href = '/', 700);
    } else {
      showAlert(data.error || 'Login failed. Check your credentials.');
      setButtonLoading(btn, false);
    }
  });
</script>
</body>
</html>
